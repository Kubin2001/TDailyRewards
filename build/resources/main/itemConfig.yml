# -------------TDailyRewards-------------
# Day: Represents at which day player will get reward can be any number
# If there is a break in days like 1,2,3,4,8,9...
# All empty days will be treated as -1
# -1 Is a special day which is called when no day is fulfilled perfect for unlimited rewards
#
# Item
# Represents material which item uses so in reality what item you will get
# Supports many conventions like:
# IRON_INGOT
# iron_ingot
# iron ingot
# Amount
# Represent how many items you will get base is 1
# Custom Name
# Represents if item has custom name supports color coding like &6, &9, &2&l
# Lore
# Additional item info optional
# Enchants
# Allows for defining a list of enchantments supports overriding vanilla values
# Money
# Accepts number how much money player will gain base is 0
# Scaling
# Special attribute decides if present if money or amount is multiplied by the amount of days
# player is above the reward day
# Custom Massage
# Overrides base massage which pops up when player gets the reward also supports color codes
# JoinID
# If join id exist or is not equal to 0 this item will be merged with other items with the same day and same join id
# Command
# Executes custom command in console use %player% to insert player name
# -------------------------------------------
# Example item just copy what you need from this one
# SomeItem:
#   Day: 1
#   ScalingStart: 10
#   Money: 200
#   Item: diamond
#   Amount: 4
#   CustomName: '&2&lReward Diamond'
#   Lore: 'Some custom lore'
#   Enchants:
#       sharpness: 5
#       unbreaking: 3
#       efficiency: 8
#   CustomMessage: '&6&lYou just received your great reward'
#   JoinID: 1
#   Command: 'eco give %player% 100'
# -------------------------------------------

